<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One-Click Looping Exploit</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0a0a0a; color: #fff; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; cursor: pointer; }
        .panel { background: #1e1e1e; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 500px; width: 100%; border: 1px solid #333; }
        h1 { font-size: 28px; color: #ff4444; margin-bottom: 15px; text-shadow: 0 0 10px #ff4444; }
        p { font-size: 15px; color: #aaa; margin-bottom: 25px; line-height: 1.6; }
        #status { margin-top: 20px; font-weight: bold; color: #ff9800; font-size: 14px; font-family: monospace; background: #111; padding: 10px; border-radius: 6px; }
    </style>
</head>

<body>
<div class="panel" id="main-panel">
    <h1>⚠️ ONE-CLICK LOOPING</h1>
    <p>Klik di mana saja pada layar ini untuk memulai Loop Pop-up, Getar, dan Suara.</p>
    <div id="status" role="status">Menunggu klik...</div>
</div>

<script>
    const statusDiv = document.getElementById("status");
    let isRunning = false;
    let tabCount = 0;

    // 1. Fungsi Getar & Suara (TTS)
    function efekHacker() {
        // Getar (Vibration API)
        if (navigator.vibrate) {
            navigator.vibrate([500, 200, 500, 200, 1000]);
        }
        
        // Suara TTS (Text-to-Speech)
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance('Hacked by Waguri');
            msg.lang = 'en-US';
            msg.rate = 0.9;
            window.speechSynthesis.speak(msg);
        }
    }

    // 2. Fungsi untuk Membuka Tab (Pop-up)
    function bukaTab() {
        try {
            // Buka tab baru ke Google
            window.open('https://google.com', '_blank');
            tabCount++;
            statusDiv.textContent = `Membuka tab ke-${tabCount}...`;
        } catch (e) {}
    }

    // 3. Loop Utama (Pemicu setelah klik)
    function mulaiSerangan() {
        if (isRunning) return;
        isRunning = true;
        
        statusDiv.textContent = "Sistem Terkunci! Memulai serangan...";
        statusDiv.style.color = "#ff4444";

        // Pemicu efek pertama (Getar & Suara)
        efekHacker();

        // Looping Pop-up setiap 1 detik (agar tidak langsung diblokir Pop-up Blocker)
        setInterval(() => {
            bukaTab();
            
            // Setiap 3 tab, picu getar & suara lagi
            if (tabCount % 3 === 0) {
                efekHacker();
            }
        }, 1000); // Jeda 1000ms
    }

    // 4. Event Listener (Hanya butuh SATU klik)
    document.body.addEventListener('click', function() {
        mulaiSerangan();
    }, { once: true }); // Hanya berjalan sekali
</script>
</body>
</html>
