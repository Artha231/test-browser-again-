<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF with Hidden APK</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f8; color: #222; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; }
        .panel { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); max-width: 600px; width: 100%; }
        h2 { color: #d32f2f; margin-bottom: 10px; }
        p { margin-bottom: 20px; line-height: 1.6; color: #555; }
        button { width: 100%; padding: 14px; cursor: pointer; border: none; border-radius: 6px; font-weight: bold; font-size: 15px; background: #d32f2f; color: #fff; transition: background 0.2s; }
        button:hover { background: #b71c1c; }
        #status { margin-top: 20px; font-weight: bold; color: #d32f2f; padding: 12px; background: #ffebee; border-radius: 6px; border: 1px solid #ffcdd2; }
    </style>
</head>

<body>
<div class="panel" id="main-panel">
    <h2>PDF Asli dengan Hidden APK</h2>
    <p>Mengunduh dokumen PDF yang valid, namun di dalamnya berisi payload APK.</p>
    
    <button id="start-btn" type="button">Unduh Dokumen PDF</button>
    <div id="status" role="status">Sistem siap.</div>
</div>

<script>
    const startBtn = document.getElementById("start-btn");
    const statusDiv = document.getElementById("status");

    const createPdfWithApk = () => {
        // 1. Membuat PDF Asli (Minimalis)
        // Ini adalah struktur PDF yang valid dan bisa dibuka di PDF Reader.
        const pdfContent = 
            "%PDF-1.4\n" +
            "1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n" +
            "2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n" +
            "3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Contents 4 0 R >>\nendobj\n" +
            "4 0 obj\n<< /Length 55 >>\nstream\nBT /F1 24 Tf 100 700 Td (Dokumen Keuangan Rahasia) Tj ET\nendstream\nendobj\n" +
            "xref\n0 5\n0000000000 65535 f \n0000000009 00000 n \n0000000058 00000 n \n0000000115 00000 n \n0000000195 00000 n \n" +
            "trailer\n<< /Size 5 /Root 1 0 R >>\nstartxref\n280\n%%EOF\n";

        // 2. Payload APK (Header ZIP: PK\x03\x04)
        const apkHeader = new Uint8Array([0x50, 0x4B, 0x03, 0x04]); 
        
        // Dummy data APK (1KB)
        const dummyData = new Uint8Array(1024);

        // 3. Gabungkan PDF (Teks) + APK (Biner)
        const encoder = new TextEncoder();
        const pdfBytes = encoder.encode(pdfContent);
        
        const combinedBytes = new Uint8Array(pdfBytes.length + apkHeader.length + dummyData.length);
        combinedBytes.set(pdfBytes, 0);
        combinedBytes.set(apkHeader, pdfBytes.length);
        combinedBytes.set(dummyData, pdfBytes.length + apkHeader.length);

        // 4. Buat Blob dengan MIME PDF
        return new Blob([combinedBytes], { type: 'application/pdf' });
    };

    startBtn.addEventListener("click", () => {
        startBtn.disabled = true;
        statusDiv.textContent = "Membuat file PDF (dengan hidden APK)...";

        try {
            const blob = createPdfWithApk();
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement("a");
            a.href = url;
            
            // Ekstensi PDF
            a.download = "Laporan_Keuangan_Rahasia.pdf";
            
            document.body.appendChild(a);
            a.click();
            
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                statusDiv.textContent = "File PDF berhasil diunduh!";
                statusDiv.style.color = "#4CAF50";
            }, 1000);

        } catch (e) {
            statusDiv.textContent = "Gagal: " + e.message;
            statusDiv.style.color = "#f00";
        }
        startBtn.disabled = false;
    });
</script>
</body>
</html>
