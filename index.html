<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blob Iframe Pop-up Bypass</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0a0a0a; color: #fff; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; }
        .panel { background: #1e1e1e; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 600px; width: 100%; border: 1px solid #333; }
        h1 { font-size: 28px; color: #ff4444; margin-bottom: 15px; text-shadow: 0 0 10px #ff4444; }
        p { font-size: 15px; color: #aaa; margin-bottom: 25px; line-height: 1.6; }
        button { width: 100%; padding: 16px; cursor: pointer; border: none; border-radius: 6px; background: #d32f2f; color: #fff; font-weight: bold; font-size: 16px; box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3); transition: background 0.2s; }
        button:hover { background: #b71c1c; }
        #status { margin-top: 20px; font-weight: bold; color: #ff9800; font-size: 14px; font-family: monospace; background: #111; padding: 10px; border-radius: 6px; }
    </style>
</head>

<body>
<div class="panel" id="main-panel">
    <h1>Blob Iframe Pop-up Bypass</h1>
    <p>Menggunakan Iframe Tersembunyi + Blob URL untuk menembus Pop-up Blocker.</p>
    <button id="start-btn" type="button">Mulai Bypass</button>
    <div id="status" role="status">Menunggu interaksi...</div>
</div>

<script>
    const startBtn = document.getElementById("start-btn");
    const statusDiv = document.getElementById("status");

    startBtn.addEventListener("click", () => {
        statusDiv.textContent = "Membuat Iframe Tersembunyi...";
        startBtn.disabled = true;

        try {
            // 1. Buat Iframe Tersembunyi
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            document.body.appendChild(iframe);

            // 2. Siapkan Payload HTML yang akan dijalankan di dalam iframe
            // Payload ini akan menembakkan window.open() 3 kali
            const payloadHTML = `
                <!DOCTYPE html>
                <html>
                <body>
                    <script>
                        // Tembak 3 tab dari dalam Iframe
                        window.open('https://google.com', '_blank');
                        window.open('https://bing.com', '_blank');
                        window.open('https://yahoo.com', '_blank');
                    <\/script>
                </body>
                </html>
            `;

            // 3. Buat Blob URL
            const blob = new Blob([payloadHTML], { type: 'text/html' });
            const url = URL.createObjectURL(blob);

            // 4. Muat Blob URL ke dalam Iframe
            iframe.src = url;

            // 5. Update status
            statusDiv.textContent = "Bypass dipicu! Cek tab baru Anda.";
            statusDiv.style.color = "#4CAF50";

            // Cleanup setelah 5 detik
            setTimeout(() => {
                if (iframe.parentNode) document.body.removeChild(iframe);
                URL.revokeObjectURL(url);
            }, 5000);

        } catch (e) {
            statusDiv.textContent = "Gagal: " + e.message;
            statusDiv.style.color = "#f00";
        }
        
        startBtn.disabled = false;
    });
</script>
</body>
</html>
