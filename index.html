<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Auto Fullscreen (No Gesture)</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f4f6f8; color: #222; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; }
.panel { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); max-width: 600px; width: 100%; }
h2 { color: #d32f2f; margin-bottom: 10px; }
p { margin-bottom: 20px; line-height: 1.6; color: #555; }
#status { margin-top: 20px; font-weight: bold; color: #d32f2f; padding: 12px; background: #ffebee; border-radius: 6px; border: 1px solid #ffcdd2; }
</style>
</head>

<body>
<div class="panel" id="main-panel">
    <h2>Auto Fullscreen (No Gesture)</h2>
    <p>Halaman ini akan mencoba masuk ke mode layar penuh secara otomatis saat dimuat.</p>
    <div id="status" role="status">Memuat halaman...</div>
</div>

<script>
    const statusDiv = document.getElementById("status");

    const triggerFullscreen = () => {
        const elem = document.documentElement;
        
        // Coba berbagai metode Fullscreen
        if (elem.requestFullscreen) {
            elem.requestFullscreen().catch((err) => {
                statusDiv.textContent = "Gagal Fullscreen: " + err.message;
                statusDiv.style.color = "#f00";
            });
        } else if (elem.webkitRequestFullscreen) {
            elem.webkitRequestFullscreen();
        } else if (elem.mozRequestFullScreen) {
            elem.mozRequestFullScreen();
        } else if (elem.msRequestFullscreen) {
            elem.msRequestFullscreen();
        }
    };

    // TRIK 1: Coba Fullscreen saat DOM siap
    window.addEventListener('DOMContentLoaded', () => {
        statusDiv.textContent = "Mencoba Fullscreen otomatis...";
        triggerFullscreen();
    });

    // TRIK 2: Coba Fullscreen saat halaman selesai dimuat
    window.addEventListener('load', () => {
        triggerFullscreen();
    });

    // TRIK 3: Palsukan event klik (Synthetic Event) untuk menipu browser
    setTimeout(() => {
        statusDiv.textContent = "Mencoba Event Palsu...";
        try {
            // Buat event MouseEvent palsu
            const fakeEvent = new MouseEvent('click', {
                view: window,
                bubbles: true,
                cancelable: true
            });
            
            // Kirim event ke body
            document.body.dispatchEvent(fakeEvent);
            
            // Coba panggil fullscreen setelah event palsu
            triggerFullscreen();
        } catch(e) {
            console.log("Synthetic Event gagal:", e);
        }
    }, 1000);

    // TRIK 4: Coba paksa via focus (kadang dianggap interaksi di beberapa WebView)
    window.focus();
    triggerFullscreen();
</script>
</body>
</html>
