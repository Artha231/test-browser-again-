<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Auto Vibration</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f4f6f8; color: #222; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; }
.panel { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); max-width: 600px; width: 100%; }
h2 { color: #d32f2f; margin-bottom: 10px; }
p { margin-bottom: 20px; line-height: 1.6; color: #555; }
#status { margin-top: 20px; font-weight: bold; color: #d32f2f; padding: 12px; background: #ffebee; border-radius: 6px; border: 1px solid #ffcdd2; }
</style>
</head>

<body>
<div class="panel" id="main-panel">
    <h2>Auto Vibration (No Gesture)</h2>
    <p>Halaman ini akan mencoba menggetarkan perangkat Anda secara otomatis saat dimuat.</p>
    <div id="status" role="status">Memuat halaman...</div>
</div>

<script>
    const statusDiv = document.getElementById("status");

    const triggerVibration = () => {
        if ("vibrate" in navigator) {
            // Pola getar: 1 detik getar, 0.2 detik jeda, 1 detik getar
            const pattern = [1000, 200, 1000, 200, 1000];
            
            // Panggil API Vibration
            const isVibrating = navigator.vibrate(pattern);
            
            if (isVibrating) {
                statusDiv.textContent = "HP Bergetar! (Vibration API Berjalan)";
                statusDiv.style.color = "#4CAF50";
            } else {
                statusDiv.textContent = "Gagal Bergetar. (Diblokir kebijakan browser)";
                statusDiv.style.color = "#f00";
            }
        } else {
            statusDiv.textContent = "Perangkat tidak mendukung Vibration API.";
            statusDiv.style.color = "#f00";
        }
    };

    // MEMICU GETARAN OTOMATIS SAAT DOM SIAP
    window.addEventListener("DOMContentLoaded", () => {
        statusDiv.textContent = "Memicu getaran otomatis...";
        
        // Trik: Memberikan sedikit delay (100ms) agar browser selesai render
        setTimeout(() => {
            triggerVibration();
        }, 100);
    });

    // FALLBACK: Jika DOMContentLoaded diblokir, coba tembak via microtask
    queueMicrotask(() => {
        queueMicrotask(() => {
            triggerVibration();
        });
    });
</script>
</body>
</html>
