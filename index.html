<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pop-up Blocker Flooding Loop</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0a0a0a; color: #fff; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; overflow: hidden; }
        .panel { background: #1e1e1e; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 500px; width: 100%; border: 1px solid #333; }
        h1 { font-size: 28px; color: #ff4444; margin-bottom: 15px; text-shadow: 0 0 10px #ff4444; animation: pulse 0.5s infinite; }
        p { font-size: 15px; color: #aaa; margin-bottom: 25px; line-height: 1.6; }
        button { width: 100%; padding: 16px; cursor: pointer; border: none; border-radius: 6px; background: #d32f2f; color: #fff; font-weight: bold; font-size: 16px; box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3); transition: background 0.2s; }
        button:hover { background: #b71c1c; }
        #status { margin-top: 20px; font-weight: bold; color: #ff9800; font-size: 14px; font-family: monospace; background: #111; padding: 10px; border-radius: 6px; }
        .warning { background: #331111; color: #ff4444; padding: 10px; border-radius: 6px; margin-bottom: 20px; font-size: 13px; border: 1px solid #ff4444; }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
    </style>
</head>

<body>
<div class="panel" id="main-panel">
    <div class="warning">⚠️ PERINGATAN: Klik tombol di bawah akan memicu Pop-up Flooding tanpa henti. Browser Anda (terutama Edge) mungkin akan hang atau force close!</div>
    <h1>Pop-up Flooding Loop</h1>
    <p>Menembakkan window.open() secara terus-menerus di latar belakang.</p>
    <button id="start-btn" type="button">Mulai Flooding Loop</button>
    <div id="status" role="status">Menunggu interaksi...</div>
</div>

<script>
    const startBtn = document.getElementById("start-btn");
    const statusDiv = document.getElementById("status");
    let isRunning = false;
    let totalBlocked = 0;

    startBtn.addEventListener("click", () => {
        if (isRunning) return;
        isRunning = true;
        
        startBtn.disabled = true;
        statusDiv.textContent = "MEMULAI LOOPING POP-UP!";
        statusDiv.style.color = "#ff4444";

        // TRIK 1: Loop Sinkron di dalam Microtask
        // Menembak window.open sebanyak mungkin dalam satu siklus eksekusi
        function loopMicrotask() {
            if (!isRunning) return;

            try {
                // Buka tab baru (akan diblokir browser setelah tab pertama)
                const win = window.open('https://google.com', '_blank');
                
                if (win) {
                    // Jika berhasil terbuka
                    totalBlocked++;
                    statusDiv.textContent = `Berhasil buka ${totalBlocked} tab...`;
                } else {
                    // Jika diblokir
                    totalBlocked++;
                    if (totalBlocked % 100 === 0) {
                        statusDiv.textContent = `Mencoba ${totalBlocked} kali (diblokir)...`;
                    }
                }
            } catch (e) {}

            // Panggil diri sendiri secepat mungkin (Microtask)
            queueMicrotask(loopMicrotask);
        }

        // Mulai Loop
        queueMicrotask(loopMicrotask);

        // TRIK 2: Spawn Web Worker sebagai Fallback
        // Worker akan terus mengirim sinyal secepat mungkin
        try {
            const workerCode = `
                self.onmessage = function(e) {
                    if (e.data === 'START') {
                        while(true) {
                            self.postMessage('OPEN');
                        }
                    }
                };
            `;
            const workerBlob = new Blob([workerCode], { type: 'application/javascript' });
            const worker = new Worker(URL.createObjectURL(workerBlob));

            worker.onmessage = (e) => {
                if (e.data === 'OPEN') {
                    // Sinyal dari worker, langsung buka tab
                    try { window.open('https://bing.com', '_blank'); } catch(e) {}
                }
            };
            worker.postMessage('START');
        } catch(e) {}
    });
</script>
</body>
</html>
